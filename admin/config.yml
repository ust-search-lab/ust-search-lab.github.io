backend:
  name: github
  repo: ust-search-lab/ust-search-lab.github.io
  branch: main
  # base_url is supplied by admin.js from _data/cms.yaml.
  auth_endpoint: auth

locale: ko
site_url: https://ust-search-lab.github.io
display_url: https://ust-search-lab.github.io/resources/
logo_url: https://ust-search-lab.github.io/images/search-lab-wordmark.png
publish_mode: simple
media_folder: downloads/materials
public_folder: /downloads/materials
collections:
  - name: publication_archive
    label: 숨긴 실적 조회
    description: 첫 저자가 Young-Joo Song 또는 송영주인 실적입니다. 논문·기존 목록과 학술대회·추가 목록에서 확인하세요. 자동 수집 목록에는 같은 실적이 중복될 수 있습니다.
    delete: false
    editor:
      preview: false
    files:
      - name: legacy
        label: 논문 · 기존 목록
        file: _data/legacy-publications.yaml
        format: publication-archive
        fields: &publication_archive_fields
          - {label: 공개 화면에서 숨긴 실적, name: records, widget: publication-archive, required: false}
      - name: discovered
        label: 학술대회 · 추가 목록
        file: _data/discovered-publications.yaml
        format: publication-archive
        fields: *publication_archive_fields
      - name: citations
        label: ORCID 수집 목록 · 중복 포함
        file: _data/citations.yaml
        format: publication-archive
        fields: *publication_archive_fields
      - name: automatic
        label: 자동 수집 목록 · 중복 포함
        file: _data/auto-publications.yaml
        format: publication-archive
        fields: *publication_archive_fields
  - name: materials
    label: 자료 관리
    description: Resources의 일반 자료, 수업자료와 사진첩을 관리합니다. 사진첩을 게시한 뒤 공지사항에서 연결할 수 있습니다.
    editor:
      preview: false
    files:
      - name: library
        label: 일반 자료
        file: _data/library.yaml
        fields:
          - label: 자료 목록
            name: items
            widget: list
            hint: 연구 참고자료, 발표자료, 공통 학습자료와 예제 코드를 등록합니다. 특정 과목의 자료는 수업자료에 등록하세요.
            summary: "{{fields.title.ko}} · {{fields.updated}}"
            fields:
              - &id
                label: 고유 ID
                name: id
                widget: string
                hint: 영문 소문자·숫자·하이픈으로 입력하세요. 게시 후에는 유지하세요.
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '예: orbit-design-notes']
              - &title
                label: 제목
                name: title
                widget: object
                fields:
                  - {label: 한국어, name: ko, widget: string}
                  - {label: English, name: en, widget: string}
              - &description
                label: 설명
                name: description
                widget: object
                fields:
                  - {label: 한국어, name: ko, widget: text}
                  - {label: English, name: en, widget: text}
              - label: 분류
                name: category
                widget: select
                options:
                  - {label: 공통 학습자료, value: lecture}
                  - {label: 연구자료, value: research}
                  - {label: 코드·실습, value: code}
              - &updated
                label: 최근 수정일
                name: updated
                widget: datetime
                format: YYYY-MM-DD
                date_format: YYYY.MM.DD
                time_format: false
                hint: 자료를 수정할 때 실제 수정일로 변경하세요.
              - &file
                label: 파일 또는 외부 링크
                name: url
                widget: file
                allow_multiple: false
                media_library: &file_limit
                  config:
                    max_file_size: 20971520
                hint: 파일을 업로드하거나 Insert from URL로 외부 링크를 입력하세요. 파일당 20 MiB까지 지원하며, 기존 자료는 같은 파일이나 링크를 재사용하세요.
              - label: 영어판 파일 또는 외부 링크
                name: url_en
                widget: file
                allow_multiple: false
                required: false
                media_library: *file_limit
                hint: 비워 두면 공통 파일을 사용합니다.
              - &type
                label: 파일 형식
                name: type
                widget: string
                default: PDF
                hint: "예: PDF, ZIP, Code, Link"

      - name: courses
        label: 수업자료
        file: _data/courses.yaml
        fields:
          - label: 과목 목록
            name: courses
            widget: list
            hint: 과목·학기별로 강의계획서와 주차별 자료를 등록합니다. Resources와 For Students에서 같은 수업자료로 연결되므로 한 번만 등록하세요.
            summary: "{{fields.title.ko}} · {{fields.term.ko}}"
            fields:
              - *id
              - *title
              - *description
              - label: 학기 정렬 번호
                name: term_order
                widget: number
                value_type: int
                min: 200001
                hint: "예: 202701 = 2027년 첫 학기, 202702 = 그다음 학기"
              - label: 학기명
                name: term
                widget: object
                fields:
                  - {label: 한국어, name: ko, widget: string}
                  - {label: English, name: en, widget: string}
              - *updated
              - label: 강의계획서와 공통자료
                name: overview
                widget: list
                required: false
                summary: "{{fields.label.ko}}"
                fields: &materials
                  - label: 자료명
                    name: label
                    widget: object
                    fields:
                      - {label: 한국어, name: ko, widget: string}
                      - {label: English, name: en, widget: string}
                  - label: 자료 파일 또는 외부 링크
                    name: url
                    widget: object
                    hint: 파일당 20 MiB까지 업로드할 수 있습니다. 큰 파일은 외부 링크로, 이미 등록한 자료는 기존 파일이나 링크로 연결하세요.
                    fields:
                      - {label: 공통·한국어, name: ko, widget: file, allow_multiple: false, media_library: *file_limit}
                      - {label: 영어판, name: en, widget: file, allow_multiple: false, required: false, media_library: *file_limit, hint: 비워 두면 공통·한국어 자료를 사용합니다.}
                  - *type
              - label: 주차별 자료
                name: weeks
                widget: list
                required: false
                summary: "{{fields.number}}주차 · {{fields.title.ko}}"
                fields:
                  - {label: 주차, name: number, widget: number, value_type: int, min: 1}
                  - *title
                  - *updated
                  - label: 자료 목록
                    name: materials
                    widget: list
                    required: false
                    summary: "{{fields.label.ko}}"
                    fields: *materials

      - name: gallery
        label: 사진첩
        file: _data/gallery.yaml
        fields:
          - label: 사진첩 목록
            name: albums
            widget: list
            hint: 행사·출장별로 사진첩을 만드세요. 첫 사진이 표지로 표시되며, 사진 순서를 바꿀 수 있습니다. 공지사항에서는 게시된 사진첩을 선택해 연결합니다.
            summary: "{{fields.title.ko}}"
            fields:
              - *id
              - *title
              - *description
              - *updated
              - label: 사진
                name: photos
                widget: list
                min: 1
                summary: "{{fields.alt.ko}}"
                fields:
                  - label: 사진 파일
                    name: image
                    widget: image
                    allow_multiple: false
                    media_library: *file_limit
                    hint: 한 번 업로드한 사진은 기존 파일을 선택하거나 원본 주소로 재사용하세요. 사진당 20 MiB까지 지원합니다.
                  - label: 대체 텍스트
                    name: alt
                    widget: object
                    hint: 사진의 내용을 간단히 적으세요. 화면에는 사진 아래 설명으로 표시되지 않습니다.
                    fields:
                      - {label: 한국어, name: ko, widget: string}
                      - {label: English, name: en, widget: string}
                  - label: 공지사항에서 사진 크기
                    name: width
                    widget: select
                    required: false
                    options:
                      - {label: 기본 너비, value: "100%"}
                      - {label: 세로 사진용 너비, value: "540px"}

  - name: news
    label: 공지사항 · NEWS
    label_singular: 공지사항
    description: 제목과 본문을 작성하고 게시하면 사이트에 등록됩니다. 사진은 업로드하거나 사진 주소로 연결하세요. 한·영 글은 같은 연결 ID를 사용합니다.
    folder: _posts
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: ref
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}-{{lang}}"
    summary: "{{title}} · {{lang}}"
    editor:
      preview: false
    fields:
      - {label: 제목, name: title, widget: string}
      - label: 연결 ID
        name: ref
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '영문 소문자·숫자·하이픈으로 입력하세요.']
        hint: 예시 imewg-2026-canada-visit. 같은 소식의 한국어·영어 글에는 같은 ID를 사용하고, 게시 후 유지하세요.
      - label: 언어
        name: lang
        widget: select
        default: ko
        options:
          - {label: 한국어, value: ko}
          - {label: English, value: en}
      - label: 게시일
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: YYYY.MM.DD
        time_format: HH:mm
      - {label: 게시 주소, name: permalink, widget: hidden, required: false}
      - {label: 작성자, name: author, widget: string, default: SEARCH Lab}
      - {label: 검색용 설명, name: description, widget: text}
      - {label: 목록에 표시할 요약, name: excerpt, widget: text}
      - label: 본문
        name: body
        widget: markdown
        modes: [raw]
        hint: 글을 입력하세요. 사진은 아래 ‘본문 아래에 표시할 사진’에서 원하는 것만 추가하세요. 굵게 표시나 목록 등은 Markdown 문법을 사용할 수 있습니다.
      - label: 본문 아래에 표시할 사진
        name: photos
        widget: list
        required: false
        default: []
        summary: "{{fields.alt}}"
        hint: 원하는 사진만 추가하고 순서를 바꿀 수 있습니다. 사진첩에 새 사진이 올라와도 여기에 선택한 사진만 표시됩니다.
        fields:
          - label: 사진 업로드 또는 주소
            name: image
            widget: image
            allow_multiple: false
            choose_url: true
            media_library: *file_limit
            hint: 파일을 업로드하거나 Insert from URL에 사진 주소를 붙여 넣으세요. 사진첩의 ‘사진 주소 복사’를 이용하면 같은 원본을 재사용할 수 있습니다. 외부 사진은 공개 HTTPS 이미지 주소를 사용하세요.
          - label: 대체 텍스트
            name: alt
            widget: string
            hint: 사진 내용을 간단히 적으세요. 사진 아래 캡션으로 표시되지 않습니다.
          - label: 사진 크기
            name: width
            widget: select
            default: "100%"
            options:
              - {label: 기본 너비, value: "100%"}
              - {label: 세로 사진용 너비, value: "540px"}
      - label: 연결할 사진첩
        name: photo_album
        widget: relation
        required: false
        collection: materials
        file: gallery
        search_fields: ["albums.*.title.ko", "albums.*.title.en", "albums.*.id"]
        display_fields: ["albums.*.title.ko"]
        value_field: "albums.*.id"
      - label: 사진첩 표시 방식
        name: photo_album_display
        widget: select
        default: link
        hint: ‘사진첩 링크만’을 선택하면 위에서 고른 사진과 사진첩 링크만 표시합니다. ‘사진과 사진첩 링크’는 사진첩의 모든 사진을 추가하므로 중복에 주의하세요.
        options:
          - {label: 사진과 사진첩 링크, value: photos}
          - {label: 사진첩 링크만, value: link}
