    - Google Patents 한국어 박재익 46개 family 중 항우연 6개만 기존 연구이력과 일치. 나머지는 가전·통신·건설 등 다른 기관/공동발명자이므로 개인 성과에서 제외.
    - KARI 전체 특허 목록 3108건은 전수 점검하지 않음. 대규모 기관 목록과 개인 이름 검색의 범위를 혼동하지 않음.
    - KAIA·NTIS의 소프트웨어 저작권자가 기관인 항목에서 개인 개발자를 추론하지 않음. 후보 6건은 개인 참여 증거가 없어 보류.
    - NTIS 소프트웨어 상세 5건은 로그인 필요 화면. 공개 검색 목록만 확인했고 인증 제한을 우회하지 않음.
    - KR 특허 등록일은 공보 (24)등록일을 사용. Google 이벤트 날짜/공고일 및 KARI 목록의 일부 중복된 날짜를 등록일로 쓰지 않음.
    - legacy-082 등록일이 개인목록 2017-11-27, NTIS 2017-11-24로 충돌하여 별도 기록.
    - 등록 사실과 현시점 권리 유효 상태는 별개. 현재 법적 상태는 조사·판단하지 않음.
