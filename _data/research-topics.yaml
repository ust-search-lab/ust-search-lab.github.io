methods:
  - id: astrodynamics
    icon: fa-solid fa-route
    ko:
      title: 우주비행역학과 정밀 궤도해석
      summary: >-
        중력과 궤도섭동을 반영한 정밀 모델로 위성·탐사선의 운동을 예측하고 궤도를 전파합니다.
        지구궤도에서의 위성 배치와 궤도유지, 달·행성 전이와 궤도삽입 등 기동 전략의 실현 가능성과 성능을 임무 조건에 맞춰 평가합니다.
    en:
      title: Astrodynamics and High-Fidelity Orbit Analysis
      summary: >-
        We predict spacecraft motion and propagate orbits using high-fidelity models of gravity and orbital perturbations.
        We assess the feasibility and performance of satellite configurations and orbit maintenance in Earth orbit, lunar and planetary transfers, orbit insertion, and other maneuvers against mission requirements.
  - id: dynamical-systems
    icon: fa-solid fa-infinity
    ko:
      title: 동역학계 이론과 다체 궤도역학
      summary: >-
        원제한 삼체문제 등 다체계 모델의 주기궤도·불변다양체와 안정성에 주목합니다.
        이러한 동역학적 구조를 활용해 저에너지 전이와 비케플러 궤도의 설계공간을 탐색하고, 정밀 궤도모델을 이용한 후속 설계의 초기해를 구성하고자 합니다.
    en:
      title: Dynamical Systems and Multi-Body Astrodynamics
      summary: >-
        We focus on periodic orbits, invariant manifolds, and stability in multi-body models such as the circular restricted three-body problem.
        We aim to use these dynamical structures to explore low-energy transfers and non-Keplerian orbits and construct initial guesses for subsequent design with high-fidelity orbit models.
  - id: optimization
    icon: fa-solid fa-chart-line
    ko:
      title: 수치최적화와 최적제어
      summary: >-
        수치최적화·최적제어·민감도 분석을 활용해 임무 제약을 만족하는 궤도·궤적과 제어 전략을 설계합니다.
        군집위성 배치, 저추력·연속추력 전이, 착륙 유도·감속 등 문제에 맞는 설계변수와 목적함수를 설정하고, 추진제·비행시간·임무 성능의 상충관계를 분석합니다.
    en:
      title: Numerical Optimization and Optimal Control
      summary: >-
        We use numerical optimization, optimal control, and sensitivity analysis to design orbits, trajectories, and control strategies that satisfy mission constraints.
        For constellation configurations, low-thrust and continuous-thrust transfers, and landing guidance and deceleration, we define design variables and objectives and examine trade-offs among propellant use, flight time, and mission performance.
  - id: architecture
    icon: fa-solid fa-diagram-project
    ko:
      title: 임무 아키텍처와 시스템 분석
      summary: >-
        임무 목표를 시스템 요구조건과 운용개념으로 구체화하고, 궤도·추진·통신·운용 조건을 통합해 임무 시나리오를 수립합니다.
        지구궤도 임무부터 심우주 탐사까지 설계 대안의 성능·자원·위험을 비교하고, 임무 전체의 실현 가능성과 기술실증 방안을 평가합니다.
    en:
      title: Mission Architecture and Systems Analysis
      summary: >-
        We translate mission objectives into system requirements and concepts of operations, integrating orbital, propulsion, communications, and operational constraints into mission scenarios.
        From Earth-orbit missions to deep-space exploration, we compare design alternatives in terms of performance, resources, and risk and assess overall feasibility and approaches to technology demonstration.
applications:
  - id: earth-orbit
    ko:
      title: 지구궤도 임무설계
      summary: 지구관측·통신·기술실증을 위한 위성의 궤도와 운용 시나리오를 설계하고, 군집위성의 배치와 관측·통신 성능을 분석합니다.
    en:
      title: Earth-Orbit Mission Design
      summary: We design satellite orbits and operations for Earth observation, communications, and technology demonstration, including constellation configurations and observation and communications performance.
  - id: planetary
    ko:
      title: 달·행성 탐사 임무설계
      summary: 달·행성 탐사의 목표에 맞는 궤도와 착륙지를 검토하고 관측·통신 조건을 반영한 임무와 운용 시나리오를 설계합니다.
    en:
      title: Lunar and Planetary Mission Design
      summary: We design lunar and planetary missions by assessing orbits, landing sites, observation opportunities, and communications geometry to develop operations scenarios.
  - id: entry-systems
    ko:
      title: 대기권 진입·착륙과 열보호
      summary: 행성의 진입·하강·착륙과 지구 재진입을 함께 다루며 궤적, 감속하중, 열환경과 열보호시스템을 연구합니다.
    en:
      title: Atmospheric Entry, Landing, and Thermal Protection
      summary: We study planetary entry, descent, and landing alongside Earth re-entry, examining trajectories, deceleration loads, thermal environments, and thermal protection systems.
  - id: solar-sail
    ko:
      title: 태양돛과 심우주 탐사
      summary: 태양복사압에 의한 추력과 돛 자세의 관계를 분석해 장기 궤적과 미래 심우주 탐사·우주실증 임무를 설계합니다.
    en:
      title: Solar Sails and Deep-Space Exploration
      summary: We study solar radiation pressure and sail attitude to design long-duration trajectories and plan future deep-space exploration and in-space demonstration missions.
  - id: optical-communications
    ko:
      title: 심우주 광통신
      summary: 탐사선의 궤적·자세와 지상국 환경을 고려해 광통신 성능, 시스템 요구조건과 운용 방안을 연구하고자 합니다.
    en:
      title: Deep-Space Optical Communications
      summary: We aim to study optical link performance, system requirements, and operations under spacecraft trajectory, attitude, and ground station environmental constraints.
  - id: cubesat
    ko:
      title: 큐브샛 개발과 우주실증
      summary: 임무설계부터 지상시험과 궤도상 운용까지의 개발 과정을 다루며 큐브샛을 통한 기술 검증 방법을 연구합니다.
    en:
      title: CubeSat Development and In-Space Demonstration
      summary: We study CubeSat technology demonstration methods across the development process, from mission design and ground testing to in-orbit operations.
