interpretation:
- 현황표의 출원일·출원번호·등록일·등록번호는 43건 모두 공란이다. 내부 접수번호는 공식 출원번호 또는 등록번호로 사용하지 않았다.
- 공식 출원·등록 정보를 문서에서 확인한 항목은 그 연도를 사용한다. 정보 미확인 항목만 내부 접수번호의 연도를 사용하며 화면에 접수연도라고 표시한다.
- 기존 공식 식별자를 보존하고 제공 문서로 소프트웨어 13건·특허 3건, 후속 공개 검색으로 상표 6건·디자인 1건·소프트웨어 1건의 서지정보를 보완했다. 검색 후 미확인 특허 2건 중 2011년 항목은 사용자 요청으로 제외하여 화면에는 2026년 특허 1건만 unknown으로 남는다.
- 상표·디자인은 특허와 구분한다. 공식 공보에서 한국항공우주연구원을 출원인·등록 권리자로 확인했다. 상표의 현황표 기재인명은 기여자로 표시하고, 디자인의 25인 명단은 공식 창작자와 모두 일치함을 확인했다.
- 해외 특허 3행은 과거 조사에서 1개 발명 계열로 연결했으며 사용자 요청에 따라 현재는 그 항목의 미국 등록만 표시한다. 3개 내부 접수번호를 미국 출원에 개별 대응시키지 않는다. KPLO 제38류 2행 통합 및 2011년 특허 요청 제외를 반영하여 지식재산은 39개 항목으로 표시한다.
- 원본 파일, 부서·대리인·계정·비용 정보는 사이트에 복사하지 않았다. 기존 공개조사 감사파일은 해당 조사시점의 기록으로 유지한다.
