ko:
  eyebrow: SPACE MISSION CONSULTING
  title: 우주임무 기술자문
  subtitle: 임무설계의 의사결정을 뒷받침하는 분석과 검토
  introduction: >-
    기업·연구기관의 우주임무 기획과 설계 검토를 지원합니다.
    임무 목표와 운용 제약을 궤도·궤적 분석, 시뮬레이션과 연결해
    설계 대안을 비교하고, 다음 단계에 필요한 기술적 판단 근거를 제공합니다.
  services_link: 서비스 살펴보기
  scope_title: 기술자문 서비스
  scope_intro: 임무 기획, 개발 중 설계 검토, 팀 역량 강화 등 프로젝트의 단계와 해결할 문제에 맞춰 서비스를 구성합니다.
  fit_label: 이런 경우에 적합합니다
  inputs_label: 착수 시 확인할 자료
  deliverable_label: 주요 산출물
  scopes:
    - title: 임무설계·타당성 분석
      fit: 임무 기획이나 개발 초기에 궤도·궤적 후보와 운용 시나리오를 비교해야 하는 팀
      description: 임무 목표, 궤도·궤적, 추진·통신·운용 제약을 함께 검토합니다. 대안별 성능과 설계 여유를 비교하고 후속 분석의 우선순위를 제시합니다.
      inputs: 임무 목표, 후보 시나리오, 주요 시스템 제약과 검토 일정
      deliverables:
        - 가정·요구조건·제약조건 정리
        - 궤도·궤적 후보와 성능 비교표
        - 권고안과 후속 검토 항목
    - title: 모델·시뮬레이션과 설계 검토
      fit: 설계 검토를 앞두고 모델의 가정과 해석 결과의 신뢰 근거를 점검해야 하는 팀
      description: 모델의 적용 범위, 입력 가정과 수치해석 결과를 검토합니다. 주요 변수의 민감도를 분석하고, 설계 판단에 필요한 추가 검증과 개선 항목을 정리합니다.
      inputs: 모델 설명, 입력 데이터, 해석 결과와 검토할 기술적 쟁점
      deliverables:
        - 모델·가정 및 해석 결과 검토 보고서
        - 주요 변수의 민감도 분석
        - 검증 보완 항목과 개선 우선순위
    - title: 임무설계 실무 워크숍
      fit: 궤도해석과 시뮬레이션을 직접 수행하고 결과를 해석하는 역량을 높이려는 팀
      description: 참여자의 경험과 업무에 맞춰 실습 중심의 교육을 구성합니다. 궤도해석, 임무 시나리오 비교, 시뮬레이션 결과 해석을 예제와 함께 다룹니다.
      inputs: 참여자의 경험, 학습 목표, 사용 도구와 교육 일정
      deliverables:
        - 팀의 수준과 업무에 맞춘 교육 과정
        - 재현 가능한 예제와 실습 자료
        - 실습 결과 피드백과 검토 체크리스트
  experience_title: 임무 현장 경험에 기반한 자문
  experience_text: >-
    박재익은 한국항공우주연구원 달탐사사업단에서 다누리(KPLO) 임무설계 책임엔지니어와
    발사 및 초기운영 MSTL(Mission Support Team Lead)을 맡았습니다.
    이 임무설계·운영 경험과 우주비행역학 연구를 바탕으로, 분석의 가정과 한계를 설명하고
    결과를 실제 설계 의사결정에 연결합니다.
  experience_link: 박재익의 경력과 연구 보기
  workflow_title: 서비스 진행 절차
  workflow:
    - title: 프로젝트 상담
      detail: 임무 목표, 해결할 문제, 보유 자료와 희망 일정을 확인합니다.
    - title: 범위·견적 협의
      detail: 검토 범위, 산출물, 완료 기준, 일정과 비용을 합의합니다.
    - title: 분석·검토
      detail: 합의한 범위에서 분석과 검토를 수행하고 주요 쟁점과 중간 결과를 공유합니다.
    - title: 결과 전달·설명
      detail: 산출물을 전달하고 결과의 의미, 적용 한계와 후속 조치를 설명합니다.
  contact_title: 프로젝트를 상담해 보세요
  contact_text: 소속과 담당자, 임무 목표, 필요한 서비스와 희망 일정을 알려 주세요. 첫 문의에는 공개 가능한 개요를 보내 주시면 됩니다.
  contact_link: 프로젝트 상담 문의
  contact_subject: 우주임무 기술자문 — 프로젝트 상담
  service_note: 서비스 범위, 일정, 비용과 최종 산출물은 프로젝트 요구사항을 검토한 뒤 사전 협의를 통해 확정합니다.

en:
  eyebrow: SPACE MISSION CONSULTING
  title: Space Mission Advisory
  subtitle: Analysis and review for informed mission design decisions
  introduction: >-
    Technical advisory for companies and research organizations planning and developing space missions.
    Orbit and trajectory analysis, simulation, and design review connect mission objectives
    with operational constraints to compare alternatives and support the next engineering decision.
  services_link: Explore services
  scope_title: Technical advisory services
  scope_intro: Services are tailored to the problem and project stage, from early mission planning and design reviews to team training.
  fit_label: Who this is for
  inputs_label: Inputs for scoping
  deliverable_label: Key deliverables
  scopes:
    - title: Mission design and feasibility
      fit: Teams comparing candidate orbits, trajectories, and operational scenarios during early mission planning or development
      description: Assess mission objectives alongside orbit, trajectory, propulsion, communications, and operational constraints. Compare performance and design margins, and identify priorities for further analysis.
      inputs: Mission objectives, candidate scenarios, key system constraints, and the review schedule
      deliverables:
        - Assumptions, requirements, and constraints register
        - Candidate orbit / trajectory performance comparison
        - Recommendations and follow-up review items
    - title: Models, simulation, and design review
      fit: Teams preparing for a design review who need to examine model assumptions and the evidence supporting their analysis
      description: Review model applicability, input assumptions, and numerical results. Analyze sensitivity to key variables and identify additional verification and improvements needed to support design decisions.
      inputs: Model documentation, input data, analysis results, and the technical issues to review
      deliverables:
        - Review report on models, assumptions, and results
        - Sensitivity analysis of key variables
        - Verification gaps and prioritized improvements
    - title: Applied mission design workshops
      fit: Teams building the skills to perform orbit analysis and simulation and interpret the results independently
      description: Practical training tailored to participants' experience and work. Sessions cover orbit analysis, mission scenario comparison, and interpretation of simulation results through worked examples.
      inputs: Participants' experience, learning objectives, available tools, and the training schedule
      deliverables:
        - Training plan tailored to the team's experience and work
        - Reproducible examples and exercise materials
        - Feedback on exercises and a results review checklist
  experience_title: Advisory grounded in mission experience
  experience_text: >-
    Jae-ik Park served as Mission Design Lead Engineer for Danuri (KPLO) and as Mission Support Team Lead (MSTL) during launch and early operations at the Korea Aerospace Research Institute.
    This mission design and operations experience, together with astrodynamics research, supports a practical approach:
    explain the assumptions and limitations of an analysis and connect its results to engineering decisions.
  experience_link: View Jae-ik Park's experience and research
  workflow_title: How an engagement works
  workflow:
    - title: Initial consultation
      detail: Discuss mission objectives, the problem to solve, available information, and the target schedule.
    - title: Scope and quotation
      detail: Agree on the scope, deliverables, completion criteria, schedule, and fees.
    - title: Analyze and review
      detail: Carry out the agreed analysis and review, sharing key issues and intermediate findings.
    - title: Delivery and briefing
      detail: Deliver the agreed outputs and explain the findings, their limitations, and recommended next steps.
  contact_title: Discuss your project
  contact_text: Share your organization and contact person, mission objectives, required service, and target schedule. A brief, nonconfidential overview is sufficient for an initial inquiry.
  contact_link: Inquire about a project
  contact_subject: Space Mission Advisory — project inquiry
  service_note: Scope, schedule, fees, and final deliverables are agreed in advance after reviewing the project's requirements.
