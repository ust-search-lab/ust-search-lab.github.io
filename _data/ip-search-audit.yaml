- KIPRIS 공식 검색 및 공개 공보에서 출원·등록번호와 날짜·명칭·출원인·등록 권리자를 대조한다.
- 한국저작권위원회 CROS 공식 공개 검색과 상세 응답에서 프로그램 등록번호·등록일·저작자를 확인한다.
- 등록일과 공고일·창작일을 구분하고, 디자인 표시연도는 내부 접수연도 2022년에서 실제 출원연도 2023년으로 바로잡는다.
- 내부 접수번호 자체는 공개 공보에 없으므로 공식 서지 확인과 기존 현황표의 연결 근거를 구분한다.
- 현재 권리의 유효성·존속 여부를 판단하지 않으며, 검색으로 확인하지 못한 항목은 번호를 추정하지 않는다.
- 공개 API 원본의 주소·개인 식별정보와 사용자 원본 문서는 사이트에 복사하지 않는다.
