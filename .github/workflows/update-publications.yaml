name: update-publications
run-name: Refresh public research outputs

on:
  schedule:
    # Approximately 09:37 Korea Standard Time, once a day.
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Search historical public works as well as the recent window
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _publications/requirements.txt
      - name: Install metadata parsers
        run: python -m pip install -r _publications/requirements.txt
      - name: Verify identity matching and source parsing
        run: python -m unittest discover -s _publications -p 'test_*.py'
      - name: Collect public records
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = 'true' ]; then
            python _publications/update.py --backfill
          else
            python _publications/update.py
          fi
      - name: Save source coverage and review candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-review
          path: _publications/review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('_publications/review.json')
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Public metadata refresh\n\n| Source | Researcher | Result | Records |\n|---|---|---|---|\n')
              for row in report['coverage']:
                  out.write(f"| {row['source']} | {row.get('researcher_id', 'shared')} | {row['status']} | {row.get('records', '—')} |\n")
              out.write(f"\nAutomatic records/patches: {report['automatic_records']}. Review candidates: {len(report['candidates'])}.\n")
              out.write('\nDownload the publication-review artifact for candidates, source errors, and coverage limits.\n')
          PY
      - name: Commit verified metadata
        id: commit
        run: |
          git add _data/auto-publications.yaml _data/publication-refresh.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public research outputs'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  build-site:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/build-site.yaml
