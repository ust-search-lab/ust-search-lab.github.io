name: build-site
run-name: Build live site

on:
  # called from on-push/on-pages
  workflow_call:

  # run manually by user
  workflow_dispatch:

env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-live-site
      cancel-in-progress: false

    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true

      - name: Verify publication rendering and update times
        run: |
          bundle exec ruby _publications/test_merge.rb
          bundle exec ruby _publications/test_freshness.rb

      - name: Install PDF cover renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify materials and CMS authentication
        run: |
          bundle exec ruby _cms/test_materials.rb
          bundle exec ruby _cms/test_material_covers.rb
          bundle exec ruby _cms/test_gallery.rb
          node --test _cms/oauth/worker.test.mjs
          node --test _cms/test_publication_archive.mjs

      - name: Get Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: Set root URL
        run: |
          printf "\n\nurl: ${{ steps.pages.outputs.origin }}" >> _config.yaml

      - name: Build live version of site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
