name: update-research-radar
run-name: Refresh Research Radar

on:
  schedule:
    # 10:17 and 22:17 Korea Standard Time; avoid the busy top of the hour.
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-research-radar
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository != 'greenelab/lab-website-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test feed processing
        run: python -m unittest discover -s _radar -p 'test_*.py'
      - name: Refresh journal metadata
        run: python _radar/update.py
      - name: Commit updated snapshot
        id: commit
        run: |
          git add _data/research-radar.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Research Radar"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN commits do not trigger on-push, so deploy explicitly.
  build-site:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/build-site.yaml
