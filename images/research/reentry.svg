<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Atmospheric re-entry: thermal protection of an ablative return capsule</title>
<desc id="desc">Conceptual cross-section in the capsule-fixed frame. Hypersonic atmospheric gas flows from left to right, first passing a detached bow shock ahead of the blunt heat shield. The shock layer contains heated gas. An ablative heat shield at the upstream surface loses material as part of its thermal response. An insulating layer reduces heat transfer to the structure and internal payload. Surface heating and internal temperature must both be evaluated. This is an ablative capsule example; other vehicles use other thermal protection approaches. Shapes and layer thicknesses are not to scale.</desc>
<defs>
<marker id="reentry-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#3478CE"/></marker>
<marker id="reentry-hot-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#A76112"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="420" rx="20" fill="#F7F9FC"/>
<text x="32" y="43" font-size="26" font-weight="700" fill="#183153">Atmospheric re-entry &amp; thermal protection</text>
<path d="M32 62H928" stroke="#E4EDF7" stroke-width="2"/>
<text x="32" y="91" font-size="18" fill="#64748B">Ablative return capsule · Conceptual cross-section, not to scale</text>
<!-- Relative gas flow is rightward; the detached shock is upstream of the shield. -->
<text x="32" y="140" font-size="21" font-weight="600" fill="#3478CE">Hypersonic flow</text>
<g fill="none" stroke="#3478CE" stroke-width="3" marker-end="url(#reentry-flow-arrow)"><path d="M54 170H318"/><path d="M54 221H318"/><path d="M54 272H318"/></g>
<path d="M425 119C380 145 360 180 360 225C360 270 380 305 425 331L500 305C440 305 410 266 410 225C410 184 440 145 500 145Z" fill="#FBEBD9"/>
<path d="M425 119C380 145 360 180 360 225C360 270 380 305 425 331" fill="none" stroke="#A76112" stroke-width="3"/>
<text x="260" y="120" font-size="20" font-weight="600" fill="#A76112">Bow shock</text>
<path d="M357 127L388 151" fill="none" stroke="#64748B" stroke-width="2"/>
<path d="M365 190Q383 156 426 144M365 260Q383 295 426 308" fill="none" stroke="#A76112" stroke-width="2" marker-end="url(#reentry-hot-arrow)"/>
<!-- Outer aeroshell, ablative forebody, insulation, payload and supports. -->
<path d="M500 145L657 194L681 225L657 256L500 305C440 305 410 266 410 225C410 184 440 145 500 145Z" fill="#FFFFFF" stroke="#183153" stroke-width="3" stroke-linejoin="round"/>
<path d="M500 145C440 145 410 184 410 225C410 266 440 305 500 305L500 289C452 289 428 257 428 225C428 193 452 161 500 161Z" fill="#E9AE85" stroke="#A76112" stroke-width="2"/>
<path d="M500 161C452 161 428 193 428 225C428 257 452 289 500 289L506 276C466 276 445 252 445 225C445 198 466 174 506 174Z" fill="#D7F0EE" stroke="#008D96" stroke-width="2"/>
<rect x="532" y="198" width="88" height="54" rx="8" fill="#E5EEF9" stroke="#3478CE" stroke-width="2"/>
<path d="M531 225H505M621 225H650" stroke="#C9D8EA" stroke-width="3"/>
<!-- Leaders stay clear of the payload. -->
<g fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round"><path d="M709 129H571L481 149"/><path d="M709 170H563L480 176"/><path d="M710 228H624"/><path d="M210 321H309L385 255"/><path d="M506 318L461 291"/></g>
<g font-size="20" font-weight="600"><text x="725" y="133" fill="#A76112">Ablative heat shield</text><text x="725" y="176" fill="#008D96">Insulation</text><text x="725" y="235" fill="#183153">Internal payload</text><text x="32" y="327" fill="#A76112">Heated gas layer</text><text x="521" y="327" fill="#A76112">Surface ablation</text></g>
<!-- Short marks denote surface material loss, not a second shock. -->
<g stroke="#A76112" stroke-width="3" stroke-linecap="round"><path d="M415 194L406 188M408 218L397 216M413 249L403 254"/></g>
<rect x="32" y="359" width="432" height="42" rx="10" fill="#FBEBD9"/><rect x="480" y="359" width="448" height="42" rx="10" fill="#E2F1EF"/>
