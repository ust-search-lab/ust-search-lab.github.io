<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Solar sail propulsion</title>
  <desc id="desc">A fully deployed square reflective sail is shown in perspective on the left. A separate two-dimensional section on the right shows incident sunlight, specularly reflected light, and thrust perpendicular to a flat ideal mirror. Specular reflection preserves the photon momentum magnitude while changing its direction, producing a force along the sail normal. Solar radiation pressure comes from photons, not solar wind. Sail attitude determines thrust direction for orbit design.</desc>
  <defs>
    <marker id="photon-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#A76112"/></marker>
    <marker id="thrust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#008D96"/></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="960" height="420" rx="20" fill="#F7F9FC"/>
    <text x="32" y="43" font-size="26" font-weight="700" fill="#183153">Solar sail propulsion</text>
    <path d="M32 62H928" stroke="#E4EDF7" stroke-width="2"/>
    <rect x="24" y="80" width="396" height="268" rx="14" fill="#FFFFFF" stroke="#E4EDF7" stroke-width="2"/>
    <text x="44" y="112" font-size="22" font-weight="700" fill="#183153">Deployed reflective sail</text>
    <!-- A single flat square under an oblique projection; all four corners are visible. -->
    <path d="M196 151L357 206L253 312L92 257Z" fill="#D9ECF0" stroke="#008D96" stroke-width="3" stroke-linejoin="round"/>
    <path d="M224.5 231.5L196 151L357 206Z" fill="#EAF4F6"/>
    <path d="M224.5 231.5L357 206L253 312Z" fill="#BBDDE3"/>
    <path d="M196 151L253 312 M357 206L92 257" stroke="#008D96" stroke-width="3"/>
    <path d="M196 151L357 206L253 312L92 257Z" fill="none" stroke="#008D96" stroke-width="3" stroke-linejoin="round"/>
    <rect x="214.5" y="221.5" width="20" height="20" rx="3" fill="#183153" stroke="#F7F9FC" stroke-width="2"/>
    <text x="222" y="332" text-anchor="middle" font-size="18" fill="#64748B">Unfolded square membrane · Concept view</text>
    <rect x="440" y="80" width="496" height="268" rx="14" fill="#FFFFFF" stroke="#E4EDF7" stroke-width="2"/>
    <text x="460" y="112" font-size="22" font-weight="700" fill="#183153">Ideal mirror: 2D section</text>
    <!-- SVG coordinates (y down): incident k=(1,0); normal n=(sqrt(3)/2,-1/2).
         Tangent t=(1/2,sqrt(3)/2), so t dot n=0.
         Reflected k'=k-2(k dot n)n=(-1/2,sqrt(3)/2).
         Photon momentum transferred to the sail is proportional to k-k'=sqrt(3)n. -->
    <path d="M695 149.3782L765 270.6218" stroke="#183153" stroke-width="6" stroke-linecap="round"/>
    <path d="M476 210H730" fill="none" stroke="#A76112" stroke-width="3" marker-end="url(#photon-arrow)"/>
    <path d="M730 210L680 296.6025" fill="none" stroke="#A76112" stroke-width="3" marker-end="url(#photon-arrow)"/>
    <path d="M730 210L842.5833 145" fill="none" stroke="#008D96" stroke-width="4" marker-end="url(#thrust-arrow)"/>
    <!-- Right-angle mark between the sail tangent and the thrust normal. -->
    <path d="M735 218.6603L743.6603 213.6603L738.6603 205" fill="none" stroke="#64748B" stroke-width="1.8"/>
    <text x="481" y="189" font-size="20" font-weight="600" fill="#A76112">Incident sunlight</text>
    <text x="817" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#008D96">Normal thrust</text>
    <text x="635" y="321" text-anchor="middle" font-size="20" font-weight="600" fill="#A76112">Reflected light</text>
    <path d="M769 265L794 276" stroke="#64748B" stroke-width="1.8"/>
    <text x="804" y="283" font-size="20" fill="#183153">Sail edge</text>
    <text x="688" y="340" text-anchor="middle" font-size="18" fill="#64748B">Photon momentum transfer · Not solar wind</text>
    <rect x="32" y="361" width="896" height="32" rx="10" fill="#E4EDF7"/>
    <text x="480" y="384" text-anchor="middle" font-size="21" font-weight="600" fill="#183153">Sail attitude → thrust direction → orbit design</text>
    <text x="32" y="410" font-size="18" fill="#64748B">Solar radiation pressure · Ideal flat, perfectly reflecting sail · Not to scale</text>
  </g>
</svg>
