<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">From mission goals to a feasible design</title>
<desc id="desc">Mission objectives and constraints inform a coupled model of trajectories, spacecraft, communications and operations. Analysis and optimization compare performance, feasibility and sensitivity. The assessment feeds back to refine the mission requirements and design.</desc>
