<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Mars entry, descent and landing: a parachute and propulsive landing example</title>
<desc id="desc">Three schematic stages show atmospheric entry, parachute descent and powered landing on Mars. The entry capsule's heat shield faces down and right, along its motion. Atmospheric drag, the parachute and landing thrust reduce descent speed in sequence. The ground-plane ellipse represents a conceptual spread of possible touchdown positions, not calculated results. Separation events are omitted. This is one representative architecture, not a sequence used by every Mars mission. Altitudes, speeds and sizes are not to scale.</desc>
<defs>
<marker id="edl-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#3478CE"/></marker>
<marker id="edl-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#64748B"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="420" rx="20" fill="#F7F9FC"/>
<text x="32" y="43" font-size="26" font-weight="700" fill="#183153">Mars entry, descent &amp; landing</text>
<path d="M32 62H928" stroke="#E4EDF7" stroke-width="2"/>
<g fill="#FFFFFF" stroke="#E4EDF7" stroke-width="2">
<rect x="32" y="83" width="280" height="253" rx="14"/><rect x="340" y="83" width="280" height="253" rx="14"/><rect x="648" y="83" width="280" height="253" rx="14"/>
</g>
<g font-size="22" font-weight="700" fill="#183153" text-anchor="middle">
<text x="172" y="116">1 · Entry</text><text x="480" y="116">2 · Descent</text><text x="788" y="116">3 · Powered landing</text>
</g>
<g fill="none" stroke="#64748B" stroke-width="2"><path d="M316 111H334" marker-end="url(#edl-arrow-gray)"/><path d="M624 111H642" marker-end="url(#edl-arrow-gray)"/></g>
<!-- Entry: the shield remains on the forward, down-right side. -->
<path d="M52 148H292V283H52Z" fill="#FBEBD9"/>
<path d="M66 158C123 178 190 223 234 270" fill="none" stroke="#3478CE" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#edl-arrow-blue)"/>
<g id="entry-capsule" transform="translate(150 209) rotate(-52)"><path d="M-28 10Q0 38 28 10L15-11H-15Z" fill="#E5EEF9" stroke="#183153" stroke-width="3"/><path d="M-37 18Q0 54 37 18" fill="none" stroke="#A76112" stroke-width="6"/></g>
<text x="172" y="316" text-anchor="middle" font-size="20" fill="#183153">Atmospheric braking</text>
<!-- Descent: simplified parachute and suspended vehicle assembly. -->
<path d="M419 190Q480 118 541 190Q510 176 480 190Q449 176 419 190Z" fill="#E5EEF9" stroke="#3478CE" stroke-width="3"/>
<path d="M419 190L468 254M480 190V254M541 190L492 254" fill="none" stroke="#3478CE" stroke-width="2"/>
<path d="M465 247H495L507 268Q480 281 453 268Z" fill="#E5EEF9" stroke="#183153" stroke-width="3"/>
<path d="M570 210V272" fill="none" stroke="#3478CE" stroke-width="3" marker-end="url(#edl-arrow-blue)"/>
<text x="480" y="316" text-anchor="middle" font-size="20" fill="#183153">Parachute braking</text>
<!-- Downward exhaust; the ellipse and points show a conceptual touchdown spread. -->
<path d="M667 288Q788 278 909 288V300H667Z" fill="#FBEBD9"/>
<ellipse cx="788" cy="289" rx="71" ry="12" fill="#E2F1EF" stroke="#008D96" stroke-width="2" stroke-dasharray="6 5"/>
<g fill="#008D96"><circle cx="757" cy="286" r="3"/><circle cx="779" cy="294" r="3"/><circle cx="808" cy="285" r="3"/></g>
<path d="M813 294H829M821 286V302" stroke="#008D96" stroke-width="2"/>
<g transform="translate(779 218)"><path d="M-21-24H21L31 0H-31Z" fill="#E5EEF9" stroke="#183153" stroke-width="3"/><path d="M-22 0L-42 24H-53M22 0L42 24H53M0-24V-39" fill="none" stroke="#183153" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-42" r="4" fill="#008D96"/><path d="M-16 4L-24 47L-8 28L0 56L8 28L24 47L16 4" fill="#F8D585" stroke="#A76112" stroke-width="2"/></g>
