<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Deep-space trajectory design</title>
<desc id="desc">A Hohmann-type heliocentric transfer leaves Earth's orbit at perihelion and reaches the target planet's orbit at aphelion half a revolution later, with the Sun at the focus of the transfer ellipse. Because the target planet keeps moving during the flight, it must lead Earth by a specific phase angle at departure. Motion is prograde (counter-clockwise seen from ecliptic north). Orbits are drawn in a flattened perspective with a 2:1 radius ratio and are not to scale.</desc>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 1L8 5L0 9Z" fill="#E99A37"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 1L8 5L0 9Z" fill="#64748B"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="420" rx="20" fill="#F7F9FC"/>
<text x="32" y="43" font-size="26" fill="#183153" font-weight="700">Deep-space trajectory design</text>
<path d="M32 62H928" stroke="#E4EDF7" stroke-width="2" stroke-linecap="round"/>
<!-- Flattened heliocentric view: ry/rx = 0.4, near side at the bottom, so prograde motion runs left -> bottom -> right -->
<ellipse cx="480" cy="214" rx="160" ry="64" fill="none" stroke="#C9D8EA" stroke-width="2"/>
<ellipse cx="480" cy="214" rx="320" ry="128" fill="none" stroke="#C9D8EA" stroke-width="2"/>
<text x="480" y="142" font-size="15" fill="#64748B" text-anchor="middle">Earth orbit</text>
<text x="480" y="78" font-size="15" fill="#64748B" text-anchor="middle">Target planet orbit</text>
<!-- Target planet motion during the transfer: 116.9 deg, from its departure position to the arrival point -->
<path d="M381.11 335.74A320 128 0 0 0 790.49 244.97" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
<!-- Transfer ellipse: a = 240, b' = 0.4 * sqrt(160 * 320) = 90.51, centre x = 560, Sun at the focus (x = 480) -->
<path d="M320 214A240 90.51 0 0 0 560 304.51" fill="none" stroke="#E99A37" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<path d="M560 304.51A240 90.51 0 0 0 800 214" fill="none" stroke="#E99A37" stroke-width="4" stroke-linecap="round"/>
<circle cx="480" cy="214" r="26" fill="#F8D585" stroke="#E99A37" stroke-width="2"/>
<text x="480" y="262" font-size="18" fill="#183153" font-weight="600" text-anchor="middle">Sun</text>
<!-- Target at departure: leads Earth by 63.1 deg, the Hohmann phase angle for a 2:1 radius ratio -->
<circle cx="335.15" cy="328.14" r="16" fill="#E9AE85" fill-opacity="0.35" stroke="#E99A37" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="320" cy="214" r="15" fill="#D7E9FC" stroke="#3478CE" stroke-width="2"/>
<circle cx="800" cy="214" r="18" fill="#E9AE85" stroke="#E99A37" stroke-width="2"/>
<g font-size="19" font-weight="700" fill="#183153">
<text x="296" y="209" text-anchor="end">Earth</text>
<text x="826" y="209">Planet</text>
</g>
<g font-size="16" fill="#64748B">
<text x="296" y="230" text-anchor="end">at departure</text>
<text x="826" y="230">at arrival</text>
<text x="335" y="366" text-anchor="middle">Planet at departure</text>
</g>
<!-- Legend -->
<path d="M724 92H760" stroke="#E99A37" stroke-width="4" stroke-linecap="round"/>
<text x="770" y="98" font-size="16" fill="#183153">Transfer trajectory</text>
<path d="M724 120H760" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/>
<text x="770" y="126" font-size="16" fill="#183153">Planet motion</text>
<text x="32" y="399" font-size="18" fill="#64748B">Conceptual heliocentric geometry · Not to scale</text>
</g>
</svg>
