<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Deep-space optical link analysis</title>
<desc id="desc">A laser terminal on a deep-space spacecraft points toward a telescope on the Earth-facing surface. The signal crosses the atmosphere before reception. Link analysis combines distance and pointing, atmospheric and weather losses, and contact opportunities to assess data return. The downlink is a conceptual example, with beam width and distances exaggerated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#A76112"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="420" rx="20" fill="#F7F9FC"/>
<text x="32" y="43" font-size="26" font-weight="700" fill="#183153">Deep-space optical link analysis</text>
<path d="M32 62H928" stroke="#E4EDF7" stroke-width="2"/>
<!-- The terminal faces right; solar arrays extend above and below the bus. -->
<rect x="93" y="174" width="49" height="46" rx="5" fill="#FFFFFF" stroke="#183153" stroke-width="2"/>
<g fill="#C8E3F5" stroke="#3478CE" stroke-width="2">
<rect x="92" y="127" width="51" height="35" rx="2"/><rect x="92" y="232" width="51" height="35" rx="2"/>
<path d="M109 127V162M126 127V162M109 232V267M126 232V267"/>
</g>
<path d="M118 162V174M118 220V232" stroke="#183153" stroke-width="3"/>
<path d="M142 188H161V206H142" fill="#D8F0ED" stroke="#008D96" stroke-width="2"/>
<text x="118" y="104" font-size="21" text-anchor="middle" font-weight="700" fill="#183153">Spacecraft</text>
<text x="118" y="301" font-size="18" text-anchor="middle" fill="#008D96">Pointing &amp; tracking</text>
<!-- Conceptual downlink fan and center ray. -->
<path d="M161 197L741 179V215Z" fill="#E99A37" fill-opacity="0.15"/>
<path d="M167 197H741" stroke="#A76112" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="431" y="160" text-anchor="middle" font-size="21" font-weight="600" fill="#A76112">Laser downlink</text>
<text x="431" y="244" text-anchor="middle" font-size="19" fill="#64748B">Range · beam spread · pointing loss</text>
<!-- Earth and atmosphere, with a telescope at the near-side surface. -->
<circle cx="830" cy="220" r="107" fill="none" stroke="#CEE2F5" stroke-width="12"/>
<circle cx="830" cy="220" r="77" fill="#DFECF9" stroke="#3478CE" stroke-width="2"/>
<path d="M807 157L824 170L818 189L787 197L785 176Z M841 211L870 202L891 219L875 237L879 257L852 272L836 246Z" fill="#8BC6C0"/>
<path d="M783 197L781 219L798 230" fill="none" stroke="#183153" stroke-width="3"/>
<rect x="746" y="187" width="39" height="20" rx="3" fill="#FFFFFF" stroke="#183153" stroke-width="2"/>
<path d="M744 183V211" stroke="#183153" stroke-width="3"/>
<text x="830" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#183153">Earth</text>
<text x="615" y="114" font-size="19" fill="#3478CE">Atmosphere</text>
<path d="M700 120L744 158" stroke="#3478CE" stroke-width="1.5" fill="none"/>
<text x="830" y="321" text-anchor="middle" font-size="19" fill="#183153">Ground telescope</text>
<path d="M790 301L771 218" stroke="#64748B" stroke-width="1.5" fill="none"/>
