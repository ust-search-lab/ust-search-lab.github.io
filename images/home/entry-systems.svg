  <path d="M314 68C236 91 191 132 191 180S236 269 314 292" fill="none" stroke="#df9c79" stroke-width="3" stroke-linecap="round" opacity=".72"/>
  <g fill="none" stroke="#df9c79" stroke-width="2" stroke-linecap="round" opacity=".55">
