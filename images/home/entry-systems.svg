<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="home-entry-title home-entry-desc">
  <title id="home-entry-title">Atmospheric entry and thermal protection</title>
  <desc id="home-entry-desc">A return capsule has a rounded heat shield facing the incoming atmospheric flow from the left. A detached bow shock and a warm gas layer sit ahead of the shield. The tapered rear of the capsule is on the right. This is a conceptual side view, not a scale diagram or a prediction of heating.</desc>
  <defs>
    <marker id="home-entry-flow" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#df9c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#071b32"/>
  <!-- Capsule-fixed frame: incoming flow points rightward toward the blunt forebody. -->
  <g fill="none" stroke="#df9c79" stroke-width="2.5" stroke-linecap="round" marker-end="url(#home-entry-flow)">
    <path d="M64 180H158"/>
    <path d="M75 124H161"/>
    <path d="M75 236H161"/>
  </g>
