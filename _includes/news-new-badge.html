{%- assign badge_lang = page.lang | default: 'ko' -%}
{%- assign badge_latest = site.posts | where: 'lang', badge_lang | sort: 'date' | reverse | first -%}
{%- if badge_latest and include.url == badge_latest.url -%}
  <span class="news-new-badge" role="img" aria-label="{{ site.data.i18n[badge_lang].post-new | escape }}">NEW</span>
{%- endif -%}
